name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Publish Windows packages
        run: |
          dotnet publish src/Lumen.Windows/Lumen.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o dist/windows-self-contained
          dotnet publish src/Lumen.Windows/Lumen.Windows.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o dist/windows-framework-dependent
          Rename-Item dist/windows-self-contained/Lumen.Windows.exe `
            "Lumen-${{ steps.version.outputs.value }}.exe"
          Rename-Item dist/windows-framework-dependent/Lumen.Windows.exe `
            "Lumen-${{ steps.version.outputs.value }}.exe"
      - name: Zip Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist/windows-self-contained/* `
            -DestinationPath "dist/Lumen-Windows-x64-self-contained-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path dist/windows-framework-dependent/* `
            -DestinationPath "dist/Lumen-Windows-x64-framework-dependent-${{ steps.version.outputs.value }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            dist/Lumen-Windows-x64-self-contained-*.zip
            dist/Lumen-Windows-x64-framework-dependent-*.zip
          if-no-files-found: error

  android:
    name: Android package
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Configure optional signing
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android-release.keystore"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE/android-release.keystore" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > src/Lumen.Android/keystore.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APKs
        working-directory: src/Lumen.Android
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace \
            -PlumenVersion=${{ steps.version.outputs.value }} \
            -PlumenVersionCode=${{ github.run_number }}
      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$SIGNED" = "true" ] && [ -f src/Lumen.Android/app/build/outputs/apk/release/app-release.apk ]; then
            cp src/Lumen.Android/app/build/outputs/apk/release/app-release.apk \
              "dist/Lumen-Android-${VERSION}.apk"
            APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
            "$APKSIGNER" verify --print-certs "dist/Lumen-Android-${VERSION}.apk" \
              | tee dist/ANDROID-CERTIFICATE.txt
            {
              echo "### Android signing certificate"
              cat dist/ANDROID-CERTIFICATE.txt
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f src/Lumen.Android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp src/Lumen.Android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "dist/Lumen-Android-${VERSION}-unsigned.apk"
            cp src/Lumen.Android/app/build/outputs/apk/debug/app-debug.apk \
              dist/Lumen-Android-debug.apk
          else
            cp src/Lumen.Android/app/build/outputs/apk/debug/app-debug.apk \
              dist/Lumen-Android-debug.apk
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: android-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lumen ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
