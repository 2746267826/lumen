name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  server:
    name: Server build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore and build
        run: |
          dotnet restore src/Lumen.Server/Lumen.Server.csproj
          dotnet build src/Lumen.Server/Lumen.Server.csproj -c Release --no-restore
      - name: Publish and smoke test
        run: |
          set -euo pipefail
          dotnet publish src/Lumen.Server/Lumen.Server.csproj -c Release -o /tmp/lumen-server
          mkdir -p /tmp/lumen-data
          Lumen__DataDir=/tmp/lumen-data \
          Lumen__PublicUrl=http://127.0.0.1:5099 \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
            dotnet /tmp/lumen-server/Lumen.Server.dll > /tmp/lumen-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/api/v1/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/lumen-server.log
            exit 1
          fi

  windows:
    name: Windows WPF build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Lint theme resource usage
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn "Converter={DynamicResource" src/Lumen.Windows --include=*.xaml; then
            echo "::error::Converter is not a dependency property; use StaticResource."
            exit 1
          fi
          if grep -rn '="{StaticResource [A-Za-z]*\(Brush\|Gradient\|Shadow\|Glow\)}"' src/Lumen.Windows --include=*.xaml; then
            echo "::error::Theme brushes must use DynamicResource so switching repaints the UI."
            exit 1
          fi
      - name: Build
        run: dotnet build src/Lumen.Windows/Lumen.Windows.csproj -c Release
      - name: Verify both publish modes
        shell: pwsh
        run: |
          dotnet publish src/Lumen.Windows/Lumen.Windows.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -o dist/self-contained
          dotnet publish src/Lumen.Windows/Lumen.Windows.csproj -c Release -r win-x64 `
            --self-contained false -p:PublishSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false -o dist/framework-dependent
          if (Get-ChildItem dist -Recurse -Filter *.pdb) { throw "PDB files must not be published" }
          if (-not (Test-Path dist/self-contained/Lumen.Windows.exe)) { throw "Missing self-contained exe" }
          if (-not (Test-Path dist/framework-dependent/Lumen.Windows.exe)) { throw "Missing framework-dependent exe" }
      - name: Launch smoke test (dark theme)
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Exe dist/framework-dependent/Lumen.Windows.exe -Theme dark -MaxBrightness 90 -Shot artifacts/theme-dark.png
      - name: Launch smoke test (light theme)
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Exe dist/framework-dependent/Lumen.Windows.exe -Theme light -MinBrightness 150 -Shot artifacts/theme-light.png
      - name: Live theme switch repaints the window
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Exe dist/framework-dependent/Lumen.Windows.exe -Theme dark -ToggleTo light -MinBrightness 150 -Shot artifacts/switch-dark.png -ShotAfterToggle artifacts/switch-light.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-theme-shots
          path: artifacts/*.png
          if-no-files-found: ignore

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: src/Lumen.Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-android-debug
          path: src/Lumen.Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f src/Lumen.Server/Dockerfile -t lumen-relay:ci .
      - name: Run container and check health
        run: |
          set -euo pipefail
          docker run -d --name lumen-ci -p 5080:8080 \
            -e Lumen__PublicUrl=http://127.0.0.1:5080 \
            lumen-relay:ci
          trap 'docker rm -f lumen-ci >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5080/api/v1/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs lumen-ci
            exit 1
          fi
